<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AppCutai</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
     
    </nav>

    <main>
      <!-- Banner institucional VPN -->
      <section class="w-100">
        <div class="container-fluid p-0 position-relative">
          <img
            src="https://www.uv.mx/transparencia/files/2025/08/Banner-portal-VPUV.png"
            alt="Banner institucional"
            class="img-fluid w-100 d-block"
            style="width: 100%; height: 550px; object-fit: contain; object-position: center;"
          />
          <div class="position-absolute bottom-0 start-0 text-start">
            <a
              href="#"
              target="_blank"
              rel="noopener"
              class="btn btn-primary m-3 disabled"
              id="uv-link"
              aria-disabled="true"
            >
              Abrir aplicación
            </a>
            <div class="text-white m-3" id="uv-status">
              Validando conexión... Solo abrir en la red UV.
            </div>
          </div>
        </div>
      </section>

      <section class="container py-4">
        <div class="card shadow-sm">
          <div class="card-body">
            <h2 class="h5">Validar IPs de la intranet UV</h2>
            <p class="text-muted mb-3">
              Ingresa una o varias IPs separadas por coma o salto de línea.
            </p>
            <textarea
              id="ip-input"
              class="form-control"
              rows="4"
              placeholder="148.226.193.87, 148.226.1.10"
            ></textarea>
            <div class="mt-3">
              <button id="validate-ip-btn" class="btn btn-outline-primary">
                Validar IPs
              </button>
            </div>
            <div id="ip-validation-result" class="mt-3"></div>
          </div>
        </div>
      </section>
    </main>

    

    <footer id="contact" class="py-4 bg-light">
 
    </footer>

    <script>
      const uvStatus = document.getElementById('uv-status');
      const uvLink = document.getElementById('uv-link');
      const ipInput = document.getElementById('ip-input');
      const validateIpBtn = document.getElementById('validate-ip-btn');
      const ipValidationResult = document.getElementById('ip-validation-result');
      const uvUrl = 'http://148.226.193.87:8080/';
      const publicIpService = 'https://api.ipify.org?format=json';

      const isUvIntranetIp = ip => {
        const trimmedIp = (ip || '').trim();
        const parts = trimmedIp.split('.');

        if (parts.length !== 4) {
          return false;
        }

        const [first, second] = parts.map(part => Number(part));

        if ([first, second].some(value => Number.isNaN(value) || value < 0 || value > 255)) {
          return false;
        }

        return first === 148 && second === 226;
      };

      const detectClientIps = async () => {
        const ips = new Set();

        try {
          const pc = new RTCPeerConnection({
            iceServers: [{ urls: ['stun:stun.l.google.com:19302'] }]
          });

          pc.createDataChannel('');
          const offer = await pc.createOffer();
          await pc.setLocalDescription(offer);

          await new Promise(resolve => setTimeout(resolve, 1000));

          pc.onicecandidate = event => {
            if (!event.candidate) {
              return;
            }

            const match = event.candidate.candidate.match(/(\d{1,3}(?:\.\d{1,3}){3})/);
            if (match) {
              ips.add(match[1]);
            }
          };

          pc.close();
        } catch (error) {
          console.warn('No se pudieron detectar IPs locales:', error);
        }

        return Array.from(ips);
      };

      const shouldEnableUvLink = (connected, publicIp = null) => {
        return connected || isUvIntranetIp(publicIp);
      };

      const updateUvStatus = (connected, publicIp = null) => {
        const enableLink = shouldEnableUvLink(connected, publicIp);

        if (enableLink) {
          uvStatus.textContent = 'Intranet UV detectada. La aplicación está accesible desde la red interna.';
          uvLink.classList.remove('disabled');
          uvLink.removeAttribute('aria-disabled');
          uvLink.href = uvUrl;
          if (publicIp) {
            uvStatus.textContent += ` IP pública: ${publicIp}`;
          }
        } else {
          uvStatus.textContent = 'No se detecta conexión con la intranet UV. Estás en internet público.';
          if (publicIp) {
            uvStatus.textContent += ` IP pública: ${publicIp}`;
          }
          uvLink.classList.add('disabled');
          uvLink.setAttribute('aria-disabled', 'true');
          uvLink.href = '#';
        }
      };

      const renderIpValidation = () => {
        const values = ipInput.value
          .split(/[\n,]+/)
          .map(value => value.trim())
          .filter(Boolean);

        if (!values.length) {
          ipValidationResult.innerHTML = '<div class="alert alert-secondary mb-0">Escribe una IP para validar.</div>';
          return;
        }

        const items = values.map(value => {
          const isValid = isUvIntranetIp(value);
          const badgeClass = isValid ? 'bg-success' : 'bg-secondary';
          return `<li class="list-group-item d-flex justify-content-between align-items-center"><span>${value}</span><span class="badge ${badgeClass}">${isValid ? 'UV' : 'Fuera de UV'}</span></li>`;
        });

        ipValidationResult.innerHTML = `<ul class="list-group">${items.join('')}</ul>`;
      };

      uvLink.addEventListener('click', event => {
        if (uvLink.classList.contains('disabled') || uvLink.getAttribute('aria-disabled') === 'true') {
          event.preventDefault();
        }
      });

      validateIpBtn.addEventListener('click', renderIpValidation);
      ipInput.addEventListener('keydown', event => {
        if (event.key === 'Enter' && (event.ctrlKey || event.metaKey)) {
          event.preventDefault();
          renderIpValidation();
        }
      });

      const checkPublicIp = () => {
        return fetch(publicIpService, { cache: 'no-store' })
          .then(response => response.json())
          .then(data => data.ip)
          .catch(() => null);
      };

      const autoValidateDetectedIps = async () => {
        const detectedIps = await detectClientIps();
        const publicIp = await checkPublicIp();
        const values = [...detectedIps, publicIp].filter(Boolean);

        if (values.length) {
          ipInput.value = values.join(',\n');
          renderIpValidation();
        }

        updateUvStatus(false, publicIp);
      };

      Promise.all([
        fetch(uvUrl, { mode: 'no-cors', cache: 'no-store' })
          .then(() => true)
          .catch(() => false),
        checkPublicIp()
      ]).then(([uvConnected, publicIp]) => {
        updateUvStatus(uvConnected, publicIp);
      });

      autoValidateDetectedIps();
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
